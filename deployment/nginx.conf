# Add this configuration to /etc/nginx/sites-available/default on your EC2 instance

server {
    listen 80;
    server_name YOUR_DOMAIN.com www.YOUR_DOMAIN.com;

    # Frontend
    location / {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Order Service API
    # Maps /service/order/products -> http://localhost:3000/api/products
    location /service/order/ {
        proxy_pass http://localhost:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Inventory Service API
    # Maps /service/inventory/inventory -> http://localhost:3001/api/inventory
    location /service/inventory/ {
        proxy_pass http://localhost:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
