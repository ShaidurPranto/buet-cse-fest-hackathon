# =========================
# 1. Namespace
# =========================
apiVersion: v1
kind: Namespace
metadata:
  name: microservices
---
# =========================
# 2. Secrets & Config
# =========================
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: microservices
type: Opaque
stringData:
  RABBITMQ_DEFAULT_USER: appuser
  RABBITMQ_DEFAULT_PASS: apppass
  # These keys are referenced by the deployments below
  ORDER_DB_URL: "postgresql://neondb_owner:npg_REMfKV1qSx9A@ep-cold-sunset-a19jpchw-pooler.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require"
  INVENTORY_DB_URL: "postgresql://neondb_owner:npg_7Sp0kHzsOgXM@ep-dawn-smoke-a104fu0e-pooler.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-config
  namespace: microservices
data:
  rabbitmq.conf: |
    load_definitions = /etc/rabbitmq/definitions.json
  definitions.json: |
    {
      "vhosts": [{ "name": "/" }],
      "users": [{ "name": "appuser", "password": "apppass", "tags": "administrator" }],
      "permissions": [{ "user": "appuser", "vhost": "/", "configure": ".*", "write": ".*", "read": ".*" }]
    }
---
# =========================
# 3. RabbitMQ (Stateful Setup)
# =========================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rabbitmq-pvc
  namespace: microservices
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3-management
          ports:
            - containerPort: 5672
            - containerPort: 15672
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: RABBITMQ_DEFAULT_USER
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: RABBITMQ_DEFAULT_PASS
          volumeMounts:
            - name: rabbitmq-data
              mountPath: /var/lib/rabbitmq
            - name: rabbitmq-config
              mountPath: /etc/rabbitmq
      volumes:
        - name: rabbitmq-data
          persistentVolumeClaim:
            claimName: rabbitmq-pvc
        - name: rabbitmq-config
          configMap:
            name: rabbitmq-config
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: microservices
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
    - name: management
      port: 15672
  type: ClusterIP
---
# =========================
# 4. Order Service
# =========================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: shaidurpranto/order-service:tagname
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: RABBITMQ_URL
              value: "amqp://appuser:apppass@rabbitmq:5672"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: ORDER_DB_URL
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: microservices
spec:
  selector:
    app: order-service
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080 
  type: NodePort
---
# =========================
# 5. Inventory Service
# =========================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      containers:
        - name: inventory-service
          image: shaidurpranto/inventory-service:tagname
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: RABBITMQ_URL
              value: "amqp://appuser:apppass@rabbitmq:5672"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: INVENTORY_DB_URL
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: microservices
spec:
  selector:
    app: inventory-service
  ports:
    - port: 3001
      targetPort: 3001
      nodePort: 30081 
  type: NodePort