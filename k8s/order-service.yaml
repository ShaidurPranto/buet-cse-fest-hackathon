apiVersion: v1
kind: Secret
metadata:
  name: order-db-secret
type: Opaque
stringData:
  # Replace with your actual Neon Postgres connection string
  DATABASE_URL: "postgresql://neondb_owner:npg_REMfKV1qSx9A@ep-cold-sunset-a19jpchw-pooler.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: order-service:latest # Use appropriate image name/tag
          imagePullPolicy: IfNotPresent # Useful for local development
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: RABBITMQ_URL
              value: "amqp://appuser:apppass@rabbitmq:5672"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: order-db-secret
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  selector:
    app: order-service
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
  type: LoadBalancer # Change to ClusterIP or NodePort based on hosting need
