apiVersion: v1
kind: Secret
metadata:
  name: inventory-db-secret
type: Opaque
stringData:
  # Replace with your actual Neon Postgres connection string
  DATABASE_URL: "postgresql://neondb_owner:npg_7Sp0kHzsOgXM@ep-dawn-smoke-a104fu0e-pooler.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      containers:
        - name: inventory-service
          image: inventory-service:latest # Use appropriate image name/tag
          imagePullPolicy: IfNotPresent # Useful for local development
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: RABBITMQ_URL
              value: "amqp://appuser:apppass@rabbitmq:5672"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: inventory-db-secret
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
spec:
  selector:
    app: inventory-service
  ports:
    - protocol: TCP
      port: 3001
      targetPort: 3001
  type: LoadBalancer # Change to ClusterIP or NodePort based on hosting need
